<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="container">
        <div class="timer-card">

            <h1>Timer</h1>
            <p class="subtitle">Defina o tempo e comece</p>

            <div class="time-inputs">
                <div>
                    <label for="minutes">Minutos</label>
                    <input type="number" id="minutes" min="0" max="99" value="5">
                </div>

                <span>:</span>

                <div>
                    <label for="seconds">Segundos</label>
                    <input type="number" id="seconds" min="0" max="59" value="0">
                </div>
            </div>

            <div class="display" id="display">
                05:00
            </div>

            <div class="buttons">
                <button id="startBtn" class="start">Iniciar</button>
                <button id="pauseBtn" class="pause">Pausar</button>
                <button id="resetBtn" class="reset">Reiniciar</button>
            </div>

            <p id="status">Pronto para começar</p>

        </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
